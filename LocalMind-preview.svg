<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">LocalMind app preview</title>
  <desc id="desc">Static vector preview of the LocalMind browser AI workspace. The interactive application is index.html.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c3f7a9"/><stop offset="1" stop-color="#9fdf87"/></linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#10111a"/>
  <rect width="252" height="900" fill="#14151e"/>
  <path d="M251.5 0v900" stroke="#2b2d3b"/>
  <rect x="24" y="24" width="31" height="31" rx="9" fill="url(#accent)"/>
  <path d="m39.5 29 2.7 8 8 2.7-8 2.8-2.7 8-2.8-8-8-2.8 8-2.7z" fill="#172015"/>
  <text x="65" y="46" fill="#f1f1f6" font-family="Arial,sans-serif" font-size="18" font-weight="700">LocalMind</text>
  <text x="170" y="45" fill="#9296a9" font-family="monospace" font-size="8">BROWSER AI</text>
  <rect x="17" y="76" width="218" height="39" rx="9" fill="#14151e" stroke="#454753"/>
  <text x="31" y="101" fill="#f1f1f6" font-family="Arial,sans-serif" font-size="13">＋  New chat</text>
  <text x="26" y="147" fill="#777b8e" font-family="monospace" font-size="10" letter-spacing="1.5">YOUR CONVERSATIONS</text>
  <rect x="17" y="160" width="218" height="36" rx="8" fill="#1e202c"/>
  <text x="30" y="183" fill="#f1f1f6" font-family="Arial,sans-serif" font-size="12">✦  Getting started</text>
  <text x="30" y="220" fill="#b7b8c4" font-family="Arial,sans-serif" font-size="12">✦  Ideas for a weekend</text>
  <rect x="17" y="745" width="104" height="31" rx="7" fill="none" stroke="#2b2d3b"/><text x="26" y="765" fill="#b6b8c4" font-family="Arial,sans-serif" font-size="10">⇩ Backup chats</text>
  <rect x="128" y="745" width="107" height="31" rx="7" fill="none" stroke="#2b2d3b"/><text x="139" y="765" fill="#b6b8c4" font-family="Arial,sans-serif" font-size="10">⇧ Restore</text>
  <circle cx="34" cy="815" r="15" fill="#2d3040"/><text x="30" y="819" fill="#b6f09c" font-family="Arial,sans-serif" font-size="12" font-weight="700">A</text>
  <text x="58" y="812" fill="#f1f1f6" font-family="Arial,sans-serif" font-size="12" font-weight="700">Alex</text><text x="58" y="829" fill="#9296a9" font-family="Arial,sans-serif" font-size="10">Saved on this device</text>
  <path d="M252 62h1188" stroke="#2b2d3b"/>
  <text x="280" y="38" fill="#c9c9d1" font-family="Arial,sans-serif" font-size="13">Getting started</text>
  <rect x="970" y="15" width="270" height="34" rx="8" fill="#171923" stroke="#2b2d3b"/>
  <circle cx="990" cy="32" r="4" fill="#b6f09c"/><text x="1002" y="36" fill="#9296a9" font-family="monospace" font-size="10">Model ready</text>
  <text x="1126" y="36" fill="#f1f1f6" font-family="Arial,sans-serif" font-size="11">Small · Qwen 2.5 0.5B⌄</text>
  <rect x="1251" y="15" width="37" height="34" rx="8" fill="#171923" stroke="#2b2d3b"/><text x="1264" y="37" fill="#b6b8c4" font-family="Arial,sans-serif" font-size="16">↓</text>
  <rect x="286" y="91" width="852" height="49" rx="9" fill="#252319" stroke="#514934"/>
  <text x="303" y="111" fill="#f0ddab" font-family="Arial,sans-serif" font-size="11" font-weight="700">First model load can take a while.</text>
  <text x="303" y="128" fill="#dcc78e" font-family="Arial,sans-serif" font-size="10">Models download to your browser and need WebGPU. Chat and image models download separately.</text>
  <text x="286" y="197" fill="#b6f09c" font-family="monospace" font-size="10" letter-spacing="2">✳  YOUR PRIVATE AI WORKSPACE</text>
  <text x="286" y="253" fill="#f1f1f6" font-family="Arial,sans-serif" font-size="43" font-weight="700">Big ideas.</text>
  <text x="286" y="305" fill="#b6f09c" font-family="Arial,sans-serif" font-size="43" font-weight="700">Right in your browser.</text>
  <text x="286" y="340" fill="#9296a9" font-family="Arial,sans-serif" font-size="14">Choose a model, then ask for help with writing, coding, translation, files, and more.</text>
  <g font-family="Arial,sans-serif">
    <g><rect x="286" y="377" width="268" height="108" rx="12" fill="#151620" stroke="#2b2d3b"/><text x="305" y="410" fill="#f1f1f6" font-size="13" font-weight="700">✦  Ask anything</text><text x="305" y="434" fill="#9296a9" font-size="11">Brainstorm, explain, summarize</text></g>
    <g><rect x="566" y="377" width="268" height="108" rx="12" fill="#151620" stroke="#2b2d3b"/><text x="585" y="410" fill="#f1f1f6" font-size="13" font-weight="700">ⓘ  Ask about LocalMind</text><text x="585" y="434" fill="#9296a9" font-size="11">Get app help without loading a model</text></g>
    <g><rect x="846" y="377" width="268" height="108" rx="12" fill="#151620" stroke="#2b2d3b"/><text x="865" y="410" fill="#f1f1f6" font-size="13" font-weight="700">⌘  Write code</text><text x="865" y="434" fill="#9296a9" font-size="11">Build, debug, or explain code</text></g>
    <g><rect x="286" y="497" width="268" height="108" rx="12" fill="#151620" stroke="#2b2d3b"/><text x="305" y="530" fill="#f1f1f6" font-size="13" font-weight="700">↗  Expand an idea</text><text x="305" y="554" fill="#9296a9" font-size="11">Turn notes into a polished draft</text></g>
    <g><rect x="566" y="497" width="268" height="108" rx="12" fill="#151620" stroke="#2b2d3b"/><text x="585" y="530" fill="#f1f1f6" font-size="13" font-weight="700">文  Translate</text><text x="585" y="554" fill="#9296a9" font-size="11">Translate text into any language</text></g>
    <g><rect x="846" y="497" width="268" height="108" rx="12" fill="#151620" stroke="#2b2d3b"/><text x="865" y="530" fill="#f1f1f6" font-size="13" font-weight="700">▧  Generate an image</text><text x="865" y="554" fill="#9296a9" font-size="11">Separate SD-Turbo download · WebGPU</text></g>
  </g>
  <rect x="286" y="749" width="852" height="91" rx="14" fill="#171923" stroke="#3a3d4a"/>
  <text x="307" y="782" fill="#9296a9" font-family="Arial,sans-serif" font-size="13">Message LocalMind…</text>
  <rect x="302" y="800" width="73" height="25" rx="7" fill="none" stroke="#2b2d3b"/><text x="313" y="817" fill="#b6b8c4" font-family="Arial,sans-serif" font-size="10">＋ Attach</text>
  <rect x="384" y="800" width="96" height="25" rx="7" fill="#222430" stroke="#2b2d3b"/><text x="395" y="817" fill="#b6b8c4" font-family="Arial,sans-serif" font-size="10">Chat⌄</text>
  <rect x="1056" y="797" width="68" height="31" rx="8" fill="#b6f09c"/><text x="1071" y="817" fill="#162013" font-family="Arial,sans-serif" font-size="11" font-weight="700">Send ↗</text>
  <text x="510" y="866" fill="#757889" font-family="Arial,sans-serif" font-size="10">Prompts run on your device · Chats and models are stored locally · AI can make mistakes</text>
</svg>
